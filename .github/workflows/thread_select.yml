name: Sélection quotidienne de thread (T15)

on:
  schedule:
    # 8h UTC = 10h Paris — un seul paramètre à ajuster si besoin.
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: pipeline-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  thread-select:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Installer les dépendances
        run: pip install .

      - name: Proposer 3 sujets de thread (picker Discord)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          DISCORD_WEBHOOK_ROUTE_A: ${{ secrets.DISCORD_WEBHOOK_ROUTE_A }}
          DISCORD_WEBHOOK_ROUTE_B: ${{ secrets.DISCORD_WEBHOOK_ROUTE_B }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_THREAD_CHANNEL_ID: ${{ secrets.DISCORD_THREAD_CHANNEL_ID }}
          DISCORD_WEBHOOK_THREAD: ${{ secrets.DISCORD_WEBHOOK_THREAD }}
        run: python -m kpop_bot thread-select

      - name: Committer la base si modifiée
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kpop.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: mise à jour automatique de la base (sélection thread T15)"
            git push
          else
            echo "Aucun changement dans la base, rien à committer."
          fi
