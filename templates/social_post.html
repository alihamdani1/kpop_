<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      background-color: #121212; /* Fond de sécurité sombre si l'image charge mal */
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* --- 1. ZONE SUPÉRIEURE : L'IMAGE & LOGO --- */
    .top-section {
      position: relative;
      width: 100%;
      height: 980px; /* ~50% de la hauteur */
      background-color: #1a1a1a;
      overflow: hidden;
    }

    /* Fond flouté (même image, agrandie) : remplit tout le cadre même quand l'image source
       n'est pas nativement au format vertical (captures d'écran/miniatures 16:9 très
       fréquentes sur les articles de presse) — même technique qu'un repost Instagram/TikTok
       d'un contenu qui n'est pas en 9:16 à l'origine. */
    .image-backdrop {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(40px) brightness(0.55);
      transform: scale(1.15); /* évite de voir le bord flou de l'image en zoomant légèrement */
    }

    /* Image nette au premier plan — TOUJOURS affichée en entier (object-fit: contain), jamais
       rognée : contrairement à un cover centré, aucun visage/texte incrusté ne peut être coupé
       quel que soit le ratio de l'image source. */
    .image-foreground {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Dégradé subtil en bas de l'image pour faire ressortir le logo */
    .image-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 250px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent);
    }

    /* Logo incrusté en bas à gauche de la photo */
    .brand-logo {
      position: absolute;
      bottom: 40px;
      left: 70px;
      font-size: 115px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -2px;
      line-height: 1;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    /* --- 2. ZONE INFÉRIEURE : FOND JAUNE & CONTENU --- */
    .bottom-section {
      position: relative;
      width: 100%;
      flex: 1; /* Prend tout le reste de la hauteur */
      background-color: #FFD43F; /* Le jaune vif signature */
      color: #000000;
      /* Bas très généreux : zone de sécurité TikTok/Reels (légende, pseudo, icônes de son). */
      padding: 56px 64px 170px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Coin coupé moderne en haut à droite (effet biseauté) */
    .cut-corner {
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 90px 90px 0;
      border-color: transparent #1a1a1a transparent transparent;
    }

    /* Zone de sécurité droite : aucun bloc de texte (badge/titre/date/puces) ne dépasse ~78 %
       de la largeur du canvas (1080px) — jamais masqué par les boutons like/commentaire/partage
       de TikTok/Reels, qui occupent la colonne droite de l'écran. */
    .main-content {
      max-width: 840px;
    }

    /* Badge de catégorie — nettement plus visible qu'un simple texte : conteneur contrasté
       fond blanc/texte noir, bien plus grand qu'avant. */
    .category-badge {
      display: inline-block;
      background-color: #000000;
      color: #ffffff;
      font-size: 50px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 12px 28px;
      margin-bottom: 36px;
    }

    /* Titre principal — accroche courte (10-15 mots), grande taille, tout en majuscules. */
    .headline {
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.15;
      letter-spacing: -1px;
      color: #000000;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* Paliers choisis en Python (visual_generator._font_size_class) selon la longueur de
       l'accroche — garantit 2 à 3 lignes maximum, jamais de débordement du bloc jaune (pas de
       scroll possible sur une capture d'écran). */
    .headline.text-lg { font-size: 76px; }
    .headline.text-md { font-size: 62px; }
    .headline.text-sm { font-size: 50px; }

    /* Date — jour/mois/année seuls (pas d'heure), style sobre et discret. */
    .timestamp {
      margin-top: 28px;
      font-size: 30px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.65);
    }

    /* Points clés (optionnels) — support de lecture rapide, taille intermédiaire entre le
       titre et la date. */
    .key-points {
      list-style: none;
      margin-top: 32px;
    }

    .key-points li {
      font-size: 34px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 14px;
      padding-left: 36px;
      position: relative;
    }

    .key-points li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #000000;
    }

    /* Call-to-action de fin — centré, largement au-dessus du bord bas (voir le padding généreux
       de .bottom-section). */
    .footer-cta {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      color: #000000;
    }
  </style>
</head>
<body>

  <!-- PARTIE HAUTE : IMAGE ET MARQUE -->
  <div class="top-section">
    <div class="image-backdrop" style="background-image: url({{ image_data_uri }});"></div>
    <img class="image-foreground" src="{{ image_data_uri }}" alt="">
    <div class="image-overlay"></div>
    <div class="brand-logo">RUAN!</div>
  </div>

  <!-- PARTIE BASSE : CONTENU JAUNE -->
  <div class="bottom-section">
    <div class="cut-corner"></div>

    <div class="main-content">
      <div class="category-badge">{{ category_label }}</div>
      <div class="headline {{ headline_size_class }}">{{ headline }}</div>
      <div class="timestamp">{{ formatted_date }}</div>
      {% if key_points %}
      <ul class="key-points">
        {% for point in key_points %}
        <li>{{ point }}</li>
        {% endfor %}
      </ul>
      {% endif %}
    </div>

    <div class="footer-cta">Abonnez-vous à RUAN! pour plus d'actualités K-pop</div>
  </div>

</body>
</html>
