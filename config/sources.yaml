# Flux RSS surveillés. `active: false` = ignoré par le fetcher (T4) sans supprimer l'entrée.
# Ajouter/retirer une source ne demande aucune modification de code.

sources:
  - name: Soompi
    url: https://www.soompi.com/feed
    active: true

  - name: Yonhap Culture
    # Le 403 initial était bien un filtre anti-bot naïf (User-Agent) — corrigé dans
    # fetcher.py. /RSS/news.xml existe mais c'est le flux général (politique, économie...),
    # hors sujet. /RSS/culture.xml est un flux mixte culture coréenne : contient du vrai
    # contenu K-pop pertinent (comebacks, classements Billboard) mélangé à du hors-sujet
    # (cinéma, actualité générale) — exactement le genre de bruit que le classificateur IA
    # est censé filtrer. Vérifié manuellement le 24/07/2026.
    url: https://en.yna.co.kr/RSS/culture.xml
    active: true

  - name: allkpop
    # Le 403 n'était PAS un filtre anti-bot : la vraie cause est un flux RSS retiré lors
    # d'une refonte du site (confirmé — /feed, /rss, /feed/rss, /rss.xml renvoient tous
    # 404, pas 403, avec le User-Agent navigateur). Le correctif User-Agent de fetcher.py
    # n'y change rien, logiquement. Remplacé par Koreaboo (voir ci-dessous). Laissé en
    # config, désactivé, pour tracer ce qui a été essayé. Vérifié manuellement le 24/07/2026.
    url: https://www.allkpop.com/rss.xml
    active: false

  - name: Koreaboo
    # Remplaçant d'allkpop — flux vérifié fonctionnel. Contrairement à Soompi/Yonhap Culture
    # (qui ne couvrent quasi aucun scandale/gossip — vérifié sur 20 titres de chaque, zéro
    # contenu SCANDALE_DRAMA), Koreaboo comble ce vide : rumeurs, controverses, débats sur
    # les réseaux. Ton plus tabloïd — une partie sera à bon droit filtrée en BRUIT_INUTILE
    # par le classificateur, c'est attendu. Vérifié manuellement le 24/07/2026.
    url: https://www.koreaboo.com/feed/
    active: true

  - name: Billboard K-Pop
    # Flux vérifié fonctionnel (10 items pertinents). Complète le mix plutôt que de le
    # dupliquer : ton journalistique sérieux (contrairement à Koreaboo), avec du vrai
    # contenu scandale/juridique de niveau industrie (ex. procès HYBE) — un angle différent
    # du gossip tabloïd. Billboard K-Town (tag proche) testé aussi, mais écarté : même
    # éditeur, chevauchement de contenu trop probable sans dédup sémantique (T4bis, pas
    # encore construite). Korea Herald introuvable aux URLs essayées ; Korea JoongAng Daily
    # n'annonce aucun flux RSS sur son site. Korea Times testé, fonctionne mais trop faible
    # (3 items, contenu hors-sujet mélangé) pour être retenu. Vérifié le 24/07/2026.
    url: https://www.billboard.com/t/k-pop/feed/
    active: true

  - name: KpopStarz
    # Ajouté après un vrai manque constaté : la sortie "WET" de J.Y. Park (23/07/2026,
    # thème officiel de Waterbomb 2026) n'était couverte par AUCUNE des 4 sources actives à
    # l'époque. Les URLs RSS devinées (/rss.xml, /rss/all.xml, /sitemap/rss.xml, /feed)
    # renvoyaient toutes 404. Le vrai flux, découvert en inspectant le HTML de la page
    # d'accueil (nécessite le User-Agent navigateur — 403 sans lui) : /rss/archives/
    # archives.xml. Fonctionne bien : 20 items, très frais, fort accent sorties/comebacks
    # ("K-Pop Releases to Watch This Week"), contient bien la story WET manquée. Vérifié le
    # 25/07/2026.
    url: https://www.kpopstarz.com/rss/archives/archives.xml
    active: true

  - name: dear. korea
    # Ajouté pour combler un vrai trou : aucune des 5 sources précédentes ne couvre les
    # concerts/événements K-pop en France — elles ne relaient une tournée française
    # qu'après coup, si jamais. dear. korea est un blog francophone dédié à la Corée, avec
    # une rubrique "AGENDA" spécifiquement sur les concerts K-pop en France (ex. titres
    # constatés : "AGENDA : JUSTB et YOUNG POSSE en concert gratuit au Vincennes Estival
    # Club", "LIVE REPORT : TWICE ambiance une nouvelle fois l'Accor Arena"). Flux WordPress
    # standard, contenu vérifié pertinent (mélange interviews/K-drama à filtrer par le
    # classificateur, comme attendu). Vérifié manuellement le 08/08/2026.
    url: https://dearkorea.fr/feed/
    active: true

  - name: Hellokpop
    # Complète le filet Route A : couverture large des tournées/concerts K-pop à l'échelle
    # mondiale (Singapour, Manille... constaté sur le flux), ce qui peut inclure des dates
    # France plus tôt que les 5 sources déjà en place. Flux WordPress standard, fonctionnel.
    # Vérifié manuellement le 08/08/2026.
    url: https://www.hellokpop.com/feed/
    active: true
