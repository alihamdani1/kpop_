# Concepts viraux curés pour les threads Twitter quotidiens (T15bis — idéation hybride).
#
# Chaque concept est croisé en code avec un groupe de config/artist_tiers.yaml pour former un
# Topic candidat (voir thread_pipeline.py) — l'IA ne choisit ni le groupe ni le concept, elle ne
# rédige qu'un titre + premise sur-mesure pour la paire déjà décidée (voir analyzer.py
# `ideate_thread_topics`). Ajouter/retirer un concept ne demande aucune modification de code.
#
# `theme` doit être une valeur de l'enum ThreadTheme (models.py). `brief` est la matière première
# donnée à l'IA pour rédiger le titre/premise — reste général (s'applique à n'importe quel
# groupe), la spécificité vient de la rédaction IA au moment du croisement avec un groupe précis.

concepts:
  - id: rivalite_generationnelle
    theme: RIVALITE_COMPARAISON
    label: "Rivalité de génération"
    brief: >
      Compare le groupe à un autre groupe d'une génération différente (2e vs 4e génération par
      exemple) sur un aspect précis et vérifiable : longévité, influence, évolution du genre.

  - id: duel_de_comeback
    theme: RIVALITE_COMPARAISON
    label: "Duel de comebacks"
    brief: >
      Compare deux sorties concurrentes sur une période proche, sur la réception critique et
      commerciale — sans dénigrer, avec des faits connus.

  - id: evolution_visuelle
    theme: RETROSPECTIVE_CARRIERE
    label: "Évolution du concept visuel"
    brief: >
      Retrace comment l'image et les concepts esthétiques du groupe ont évolué entre leurs
      différentes eras.

  - id: debuts_vs_aujourdhui
    theme: RETROSPECTIVE_CARRIERE
    label: "Débuts vs aujourd'hui"
    brief: >
      Compare le groupe à ses débuts et sa version actuelle : son, maturité, ambition
      artistique.

  - id: identite_sonore
    theme: ANALYSE_COMEBACK
    label: "Identité sonore"
    brief: >
      Analyse ce qui rend la signature musicale du groupe reconnaissable, à travers deux titres
      différents de leur discographie.

  - id: concept_album
    theme: ANALYSE_COMEBACK
    label: "Concept d'album"
    brief: >
      Décortique la cohérence thématique et visuelle d'un album ou d'une ère marquante du
      groupe.

  - id: polemique_reexaminee
    theme: RECAP_SCANDALE
    label: "Polémique réexaminée avec le recul"
    brief: >
      Revient sur une controverse déjà connue et publique avec du recul, sans relancer la
      polémique elle-même ni prendre parti.

  - id: gestion_de_crise
    theme: RECAP_SCANDALE
    label: "Gestion de crise"
    brief: >
      Analyse comment le groupe ou son agence a géré publiquement une situation délicate déjà
      connue.

  - id: tournee_france
    theme: CONNEXION_FRANCE
    label: "Historique des tournées en France"
    brief: >
      Retrace la présence du groupe en France : concerts, dates marquantes, accueil du public.

  - id: fandom_francophone
    theme: CONNEXION_FRANCE
    label: "Fandom francophone"
    brief: >
      Explore la spécificité de la communauté de fans française ou francophone du groupe.

  - id: mythe_trainee
    theme: MYTHE_VS_REALITE
    label: "Mythe du système des trainees"
    brief: >
      Déconstruit une idée reçue sur la formation des idols (durée, rigueur, réalité vs
      fantasme) en s'appuyant sur le parcours connu du groupe.

  - id: mythe_recette_magique
    theme: MYTHE_VS_REALITE
    label: "Le mythe de la recette magique"
    brief: >
      Interroge l'idée qu'un succès viral du groupe obéirait à une formule reproductible.

  - id: record_marquant
    theme: RECORD_ANECDOTE
    label: "Record marquant remis en perspective"
    brief: >
      Explique pourquoi un record connu du groupe (vues, ventes, streams) est réellement
      significatif, pas juste un chiffre isolé.

  - id: anecdote_meconnue
    theme: RECORD_ANECDOTE
    label: "Anecdote méconnue"
    brief: >
      Met en lumière un fait peu connu mais vérifiable de l'histoire du groupe.

  - id: auto_composition
    theme: COULISSES_INDUSTRIE
    label: "L'auto-production comme force motrice"
    brief: >
      Explore le rôle des membres du groupe dans l'écriture ou la production de leur musique.

  - id: structure_agence
    theme: COULISSES_INDUSTRIE
    label: "Coulisses de l'agence"
    brief: >
      Explique le fonctionnement connu de l'agence ou du système de promotion autour du groupe.

  - id: rituel_fandom
    theme: CULTURE_FANS
    label: "Rituels de fandom"
    brief: >
      Décrit une pratique culturelle propre aux fans du groupe (lightsticks, fanchants,
      surnoms, rituels de concert).

  - id: theorie_fan
    theme: CULTURE_FANS
    label: "Théorie de fan"
    brief: >
      Présente une théorie ou interprétation populaire chez les fans autour d'une œuvre ou d'un
      élément connu du groupe.

  # --- 8 piliers éditoriaux (T15quater) — les 6 concepts ci-dessous (Tops & Data, Dramas &
  # Affaires, Storytelling & Histoires) portent un poids renforcé (weight: 2.0) : ils repassent
  # deux fois plus souvent que les concepts à poids par défaut (1.0) dans la rotation
  # déterministe de thread_pipeline._candidate_pairs — voir TODO.md T15quater.

  - id: top_ventes_streams
    theme: RECORD_ANECDOTE
    label: "Top ventes/streams"
    weight: 2.0
    brief: >
      Classe ou met en perspective les plus gros chiffres de vente ou de streaming du groupe,
      avec des repères concrets pour juger de leur ampleur réelle.

  - id: top_artistes_popularite
    theme: RECORD_ANECDOTE
    label: "Top popularité artiste"
    weight: 2.0
    brief: >
      Situe la popularité d'un membre ou du groupe par rapport à des repères connus et
      vérifiables (récompenses, classements, présence internationale).

  - id: recap_drama_groupe
    theme: RECAP_SCANDALE
    label: "Récap drama du groupe"
    weight: 2.0
    brief: >
      Reconstitue chronologiquement un drama ou une polémique déjà publique concernant le
      groupe, avec le recul nécessaire — jamais pour relancer la polémique elle-même.

  - id: affaire_industrie
    theme: COULISSES_INDUSTRIE
    label: "Affaire de l'industrie"
    weight: 2.0
    brief: >
      Explique une affaire connue (litige contractuel, procès, conflit avec une agence) qui a
      marqué l'industrie K-pop, avec ses conséquences concrètes.

  - id: story_resilience_success
    theme: RETROSPECTIVE_CARRIERE
    label: "Histoire de résilience"
    weight: 2.0
    brief: >
      Raconte comment le groupe ou un membre a traversé une période difficile connue avant de
      rebondir — une histoire de résilience, pas juste une liste de succès.

  - id: coulisses_hit_chanson
    theme: RETROSPECTIVE_CARRIERE
    label: "Coulisses d'un hit"
    weight: 2.0
    brief: >
      Retrace la genèse connue d'un titre marquant du groupe (écriture, choix artistique,
      réception) — l'histoire derrière la chanson, pas juste son succès commercial.

  - id: regles_contrats_idols
    theme: COULISSES_INDUSTRIE
    label: "Règles des contrats d'idols"
    brief: >
      Explique un aspect connu et vérifiable du fonctionnement des contrats d'idols (durée,
      clauses, débats publics sur le sujet) sans viser un cas précis non confirmé.

  - id: cout_realite_comeback
    theme: COULISSES_INDUSTRIE
    label: "Coût réel d'un comeback"
    brief: >
      Détaille ce qu'implique concrètement la production d'un comeback (répétitions, clip,
      promotion) pour donner une vraie idée de l'ampleur du travail derrière.

  - id: lore_mv_theories
    theme: MYTHE_VS_REALITE
    label: "Théories de lore MV"
    brief: >
      Présente une théorie ou un fil narratif populaire construit par les fans autour de
      l'univers visuel des clips du groupe — en le présentant explicitement comme une théorie.

  - id: talent_sous_estime
    theme: MYTHE_VS_REALITE
    label: "Talent sous-estimé"
    brief: >
      Met en avant une compétence réelle et vérifiable d'un membre trop peu reconnue
      publiquement (composition, chorégraphie, technique vocale...).

  - id: connexion_france_mode
    theme: CONNEXION_FRANCE
    label: "Impact France & Mode"
    brief: >
      Explore les liens du groupe avec la France au-delà des concerts : ambassadeurs de mode,
      collaborations avec des maisons de luxe françaises, apparitions remarquées.

  - id: evolution_physique_statut
    theme: RETROSPECTIVE_CARRIERE
    label: "Métamorphose avant/après"
    brief: >
      Montre l'évolution du statut et de l'image publique du groupe entre ses débuts et
      aujourd'hui — la trajectoire, pas un jugement sur l'apparence physique.
